name: Build KidTimer Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Project, SDK Licenses, and Keystore
        run: |
          set +e
          shopt -s nullglob
          # 1. إذا كان المشروع مرفوعاً كملف مضغوط (.zip) فك ضغطه تلقائياً
          for z in *.zip */*.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z ..."
              unzip -o -q "$z" -d .
            fi
          done

          # 2. البحث عن ملفات المشروع حتى لو كانت داخل مجلد فرعي
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::لم يتم العثور على ملفات المشروع في المستودع! اذهب إلى صفحة المستودع الرئيسية واضغط Add file -> Upload files وارفع ملف kidtime-lock-ready.zip كما هو بدون فك ضغط."
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          if [ "$PROJECT_DIR" != "." ]; then
            echo "Moving project files from $PROJECT_DIR to root..."
            cp -rn "$PROJECT_DIR"/. .
          fi

          # 3. إصلاح الإشارات المحذوفة MathChallengeAppContext إن وجدت
          if [ -d "app/src" ]; then
            find app/src -name "*.kt" -exec sed -i '/MathChallengeAppContext/d' {} +
          fi

          # 4. إنشاء ملفات البيئة المطلوبة
          if [ ! -f .env.example ]; then
            echo "# GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # 5. توليد مفتاح التوقيع debug.keystore إن لم يكن موجوداً
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 6. قبول تراخيص Android SDK
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKM=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          fi
          set -e

      - name: Install Gradle 9.3.1 & Build Debug APK
        run: |
          if [ ! -f /tmp/gradle-9.3.1/bin/gradle ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
            unzip -q -o /tmp/gradle.zip -d /tmp
          fi
          /tmp/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidTimer-APK
          path: app/build/outputs/apk/debug/*.apk
